# Server Configuration
server.port=8080
server.servlet.context-path=/

# File Upload Configuration (5 MB limit)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# SQLite Database Configuration (Local persistence)
spring.datasource.url=jdbc:sqlite:ats_resume.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ATS Scoring Weights (Must sum to 100 for normal cases)
ats.scoring.weights.required-skills=40
ats.scoring.weights.preferred-skills=15
ats.scoring.weights.responsibilities=20
ats.scoring.weights.tools-technologies=15
ats.scoring.weights.education-experience=10

# Optional Ollama Local LLM Configuration
ats.ollama.enabled=false
ats.ollama.base-url=http://localhost:11434
ats.ollama.model=qwen2.5:1.5b
ats.ollama.timeout-seconds=25

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.ats.intelligence=INFO
logging.level.org.springframework.web=INFO
